cout << \"No records available.\\n\"; return; }\n    cout << \"Roll No\\tAdmission Score\\n\";\n    for (int i = 0; i < count; i++)\n        cout << student[i][0] << \"\\t\" << student[i][1] << '\\n';\n}\nint main() {\n    int choice;\n    do {\n        cout << \"\\n1.Insert  2.Search  3.Delete  4.Update  5.Display  6.Exit\\nChoice: \";\n        cin >> choice;\n        switch (choice) {\n            case 1: insertRecord(); break;\n            case 2: searchRecord(); break;\n            case 3: deleteRecord(); break;\n            case 4: updateRecord(); break;\n            case 5: displayRecords(); break;\n            case 6: cout << \"Program ended.\\n\"; break;\n            default: cout << \"Invalid choice.\\n\";\n        }\n    } while (choice != 6);\n    return 0;\n}"], "notes": ""}, {"section": "Practical 1 — ARRAY OPERATIONS", "title": "Q2. Delete a student record by roll number and display the updated array.", "description": "Simple standalone answer: delete the selected roll number, shift remaining values left, and display the updated array.", "codes": ["#include <iostream>\nusing namespace std;\nint main() {\n    int a[5] = {101, 102, 103, 104, 105};\n    int n = 5, key, pos = -1;\n    cout << \"Enter roll number to delete: \"; cin >> key;\n    for (int i = 0; i < n; i++) if (a[i] == key) { pos = i; break; }\n    if (pos == -1) cout << \"Record not found\";\n    else {\n        for (int i = pos; i < n - 1; i++) a[i] = a[i + 1];\n        n--; cout << \"Updated array: \";\n        for (int i = 0; i < n; i++) cout << a[i] << \" \";\n    }\n    return 0;\n}"], "notes": ""}, {"section": "Practical 1 — ARRAY OPERATIONS", "title": "Q3. Search for roll number 101 and display Yes/No.", "description": "", "codes": ["#include <iostream>\nusing namespace std;\nint main() {\n    int a[] = {101, 102, 103, 104, 105};\n    int key = 101, found = 0;\n    for (int i = 0; i < 5; i++)\n        if (a[i] == key) { found = 1; break; }\n    if (found) cout << \"Yes\";\n    else cout << \"No\";\n    return 0;\n}"], "notes": "============================================================\nPRACTICAL 3 — STACK\n============================================================"}, {"section": "Practical 3 — STACK", "title": "Q1. Implement stack using array with display, PUSH, POP and overflow/underflow handling.", "description": "", "codes": ["#include <iostream>\nusing namespace std;\nconst int MAX = 5;\nint st[MAX], top = -1;\nvoid push(int x) {\n    if (top == MAX - 1) cout << \"Stack Overflow\\n\";\n    else { st[++top] = x; cout << x << \" pushed\\n\"; }\n}\nvoid pop() {\n    if (top == -1) cout << \"Stack Underflow\\n\";\n    else cout << st[top--] << \" popped\\n\";\n}\nvoid display() {\n    if (top == -1) { cout << \"Stack is empty\\n\"; return; }\n    for (int i = top; i >= 0; i--) cout << st[i] << '\\n';\n}\nint main() {\n    int ch, x;\n    do {\n        cout << \"\\n1.Push 2.Pop 3.Display 4.Exit\\nChoice: \";\n        cin >> ch;\n        if (ch == 1) { cout << \"Value: \"; cin >> x; push(x); }\n        else if (ch == 2) pop();\n        else if (ch == 3) display();\n    } while (ch != 4);\n    return 0;\n}"], "notes": ""}, {"section": "Practical 3 — STACK", "title": "Q2. Convert infix expression to postfix.", "description": "", "codes": ["#include <iostream>\n#include <stack>\n#include <string>\n#include <cctype>\nusing namespace std;\nint precedence(char c) {\n    if (c == '^') return 3;\n    if (c == '*' || c == '/') return 2;\n    if (c == '+' || c == '-') return 1;\n    return 0;\n}\nint main() {\n    string infix, postfix = \"\";\n    stack<char> s;\n    cout << \"Enter infix expression (no spaces): \";\n    cin >> infix;\n    for (char c : infix) {\n        if (isalnum(static_cast<unsigned char>(c))) postfix += c;\n        else if (c == '(') s.push(c);\n        else if (c == ')') {\n            while (!s.empty() && s.top() != '(') {\n                postfix += s.top(); s.pop();\n            }\n            if (!s.empty()) s.pop();\n        } else {\n            while (!s.empty() && s.top() != '(' &&\n                   (precedence(s.top()) > precedence(c) ||\n                   (precedence(s.top()) == precedence(c) && c != '^'))) {\n                postfix += s.top(); s.pop();\n            }\n            s.push(c);\n        }\n    }\n    while (!s.empty()) { postfix += s.top(); s.pop(); }\n    cout << \"Postfix: \" << postfix << '\\n';\n    return 0;\n}"], "notes": ""}, {"section": "Practical 3 — STACK", "title": "Q3. Convert infix to prefix (basic operators and parentheses).", "description": "", "codes": ["#include <iostream>\n#include <algorithm>\n#include <stack>\n#include <string>\n#include <cctype>\nusing namespace std;\nint prec(char c) {\n    if (c == '^') return 3;\n    if (c == '*' || c == '/') return 2;\n    if (c == '+' || c == '-') return 1;\n    return 0;\n}\nint main() {\n    string in, rev, post = \"\";\n    stack<char> s;\n    cout << \"Enter infix (no spaces): \";\n    cin >> in;\n    rev = in;\n    reverse(rev.begin(), rev.end());\n    for (char &c : rev) {\n        if (c == '(') c = ')';\n        else if (c == ')') c = '(';\n    }\n    for (char c : rev) {\n        if (isalnum(static_cast<unsigned char>(c))) post += c;\n        else if (c == '(') s.push(c);\n        else if (c == ')') {\n            while (!s.empty() && s.top() != '(') { post += s.top(); s.pop(); }\n            if (!s.empty()) s.pop();\n        } else {\n            while (!s.empty() && s.top() != '(' && prec(s.top()) > prec(c)) {\n                post += s.top(); s.pop();\n            }\n            s.push(c);\n        }\n    }\n    while (!s.empty()) { post += s.top(); s.pop(); }\n    reverse(post.begin(), post.end());\n    cout << \"Prefix: \" << post << '\\n';\n    return 0;\n}"], "notes": ""}, {"section": "Practical 3 — STACK", "title": "Q4. Multiple stacks in one array — two stacks.", "description": "", "codes": ["#include <iostream>\nusing namespace std;\nconst int N = 10;\nint a[N], top1 = -1, top2 = N;\nvoid push1(int x) {\n    if (top1 + 1 == top2) cout << \"Overflow\\n\";\n    else a[++top1] = x;\n}\nvoid push2(int x) {\n    if (top1 + 1 == top2) cout << \"Overflow\\n\";\n    else a[--top2] = x;\n}\nvoid pop1() {\n    if (top1 == -1) cout << \"Stack 1 Underflow\\n\";\n    else cout << a[top1--] << '\\n';\n}\nvoid pop2() {\n    if (top2 == N) cout << \"Stack 2 Underflow\\n\";\n    else cout << a[top2++] << '\\n';\n}\nint main() {\n    push1(10); push1(20); push2(90); push2(80);\n    pop1(); pop2();\n    return 0;\n}"], "notes": "============================================================\nPRACTICAL 4 — QUEUE\n============================================================"}, {"section": "Practical 4 — QUEUE", "title": "Q1. Implement queue using array: enqueue, dequeue, peek and display.", "description": "", "codes": ["#include <iostream>\nusing namespace std;\nconst int MAX = 5;\nclass Queue {\n    int a[MAX], front, rear;\npublic:\n    Queue() { front = rear = -1; }\n    void enqueue(int x) {\n        if (rear == MAX - 1) { cout << \"Queue Overflow\\n\"; return; }\n        if (front == -1) front = 0;\n        a[++rear] = x;\n        cout << x << \" inserted\\n\";\n    }\n    void dequeue() {\n        if (front == -1) { cout << \"Queue Underflow\\n\"; return; }\n        cout << a[front] << \" deleted\\n\";\n        if (front == rear) front = rear = -1;\n        else front++;\n    }\n    void peek() {\n        if (front == -1) cout << \"Queue is empty\\n\";\n        else cout << \"Front: \" << a[front] << '\\n';\n    }\n    void display() {\n        if (front == -1) { cout << \"Queue is empty\\n\"; return; }\n        for (int i = front; i <= rear; i++) cout << a[i] << ' ';\n        cout << '\\n';\n    }\n};\nint main() {\n    Queue q; int ch, x;\n    do {\n        cout << \"\\n1.Enqueue 2.Dequeue 3.Peek 4.Display 5.Exit\\nChoice: \";\n        cin >> ch;\n        if (ch == 1) { cout << \"Value: \"; cin >> x; q.enqueue(x); }\n        else if (ch == 2) q.dequeue();\n        else if (ch == 3) q.peek();\n        else if (ch == 4) q.display();\n    } while (ch != 5);\n    return 0;\n}"], "notes": ""}, {"section": "Practical 4 — QUEUE", "title": "Q2. Queue of customer names.", "description": "", "codes": ["#include <iostream>\n#include <string>\nusing namespace std;\nconst int MAX = 5;\nclass CustomerQueue {\n    string a[MAX]; int front, rear;\npublic:\n    CustomerQueue() { front = rear = -1; }\n    void enqueue(string name) {\n        if (rear == MAX - 1) { cout << \"Queue Overflow\\n\"; return; }\n        if (front == -1) front = 0;\n        a[++rear] = name;\n        cout << name << \" joined the queue\\n\";\n    }\n    void dequeue() {\n        if (front == -1) { cout << \"Queue is empty\\n\"; return; }\n        cout << a[front] << \" served\\n\";\n        if (front == rear) front = rear = -1;\n        else front++;\n    }\n    void display() {\n        if (front == -1) { cout << \"No customers waiting\\n\"; return; }\n        for (int i = front; i <= rear; i++) cout << a[i] << '\\n';\n    }\n};\nint main() {\n    CustomerQueue q; int ch; string name;\n    do {\n        cout << \"\\n1.Add customer 2.Serve customer 3.Display 4.Exit\\nChoice: \";\n        cin >> ch;\n        if (ch == 1) { cout << \"Name: \"; cin >> name; q.enqueue(name); }\n        else if (ch == 2) q.dequeue();\n        else if (ch == 3) q.display();\n    } while (ch != 4);\n    return 0;\n}"], "notes": ""}, {"section": "Practical 4 — QUEUE", "title": "Q3. Circular queue using array.", "description": "", "codes": ["#include <iostream>\nusing namespace std;\nconst int N = 5;\nclass CircularQueue {\n    int a[N], front, rear, count;\npublic:\n    CircularQueue() { front = 0; rear = -1; count = 0; }\n    void enqueue(int x) {\n        if (count == N) { cout << \"Queue Full\\n\"; return; }\n        rear = (rear + 1) % N; a[rear] = x; count++;\n    }\n    void dequeue() {\n        if (count == 0) { cout << \"Queue Empty\\n\"; return; }\n        cout << a[front] << \" removed\\n\";\n        front = (front + 1) % N; count--;\n    }\n    void display() {\n        if (count == 0) { cout << \"Queue Empty\\n\"; return; }\n        for (int i = 0; i < count; i++) cout << a[(front + i) % N] << ' ';\n        cout << '\\n';\n    }\n};\nint main() {\n    CircularQueue q; q.enqueue(10); q.enqueue(20); q.enqueue(30);\n    q.display(); q.dequeue(); q.display(); return 0;\n}"], "notes": ""}, {"section": "Practical 4 — QUEUE", "title": "Q4. Queue using linked list.", "description": "", "codes": ["#include <iostream>\nusing namespace std;\nstruct Node { int data; Node* next; Node(int x) : data(x), next(NULL) {} };\nclass Queue {\n    Node *front, *rear;\npublic:\n    Queue() { front = rear = NULL; }\n    void enqueue(int x) {\n        Node* n = new Node(x);\n        if (rear == NULL) front = rear = n;\n        else { rear->next = n; rear = n; }\n    }\n    void dequeue() {\n        if (front == NULL) { cout << \"Queue Empty\\n\"; return; }\n        Node* temp = front; cout << temp->data << \" removed\\n\";\n        front = front->next;\n        if (front == NULL) rear = NULL;\n        delete temp;\n    }\n    void display() {\n        for (Node* p = front; p != NULL; p = p->next) cout << p->data << ' ';\n        cout << '\\n';\n    }\n};\nint main() {\n    Queue q; q.enqueue(10); q.enqueue(20); q.enqueue(30);\n    q.display(); q.dequeue(); q.display(); return 0;\n}"], "notes": "============================================================\nPRACTICAL 5 — BINARY SEARCH TREE (BST)\n============================================================"}, {"section": "Practical 5 — BINARY SEARCH TREE (BST)", "title": "Q1. Create BST, insert elements and display inorder traversal.", "description": "", "codes": ["#include <iostream>\nusing namespace std;\nstruct Node { int data; Node *left, *right; Node(int x):data(x),left(NULL),right(NULL){} };\nNode* insert(Node* root, int x) {\n    if (root == NULL) return new Node(x);\n    if (x < root->data) root->left = insert(root->left, x);\n    else if (x > root->data) root->right = insert(root->right, x);\n    return root;\n}\nvoid inorder(Node* root) {\n    if (root) { inorder(root->left); cout << root->data << ' '; inorder(root->right); }\n}\nint main() {\n    Node* root = NULL; int n, x;\n    cout << \"How many elements? \"; cin >> n;\n    for (int i = 0; i < n; i++) { cin >> x; root = insert(root, x); }\n    cout << \"Inorder: \"; inorder(root); cout << '\\n'; return 0;\n}"], "notes": ""}, {"section": "Practical 5 — BINARY SEARCH TREE (BST)", "title": "Q2. Search a student roll number in a BST.", "description": "", "codes": ["#include <iostream>\nusing namespace std;\nstruct Node { int data; Node *left,*right; Node(int x):data(x),left(NULL),right(NULL){} };\nNode* insert(Node* r,int x) {\n    if (!r) return new Node(x);\n    if (x<r->data) r->left=insert(r->left,x);\n    else if (x>r->data) r->right=insert(r->right,x);\n    return r;\n}\nbool search(Node* r,int key) {\n    if (!r) return false;\n    if (r->data==key) return true;\n    return key<r->data ? search(r->left,key) : search(r->right,key);\n}\nint main() {\n    Node* root=NULL; int n,x,key;\n    cout<<\"Number of roll numbers: \"; cin>>n;\n    for(int i=0;i<n;i++){cin>>x;root=insert(root,x);}\n    cout<<\"Roll number to search: \";cin>>key;\n    if(search(root,key)) cout<<\"Student record found.\\n\";\n    else cout<<\"Student record not found.\\n\";\n    return 0;\n}"], "notes": ""}, {"section": "Practical 5 — BINARY SEARCH TREE (BST)", "title": "Q3. Delete a node from a BST.", "description": "", "codes": ["#include <iostream>\nusing namespace std;\nstruct Node { int data; Node *left,*right; Node(int x):data(x),left(NULL),right(NULL){} };\nNode* insert(Node* r,int x) {\n    if(!r) return new Node(x);\n    if(x<r->data) r->left=insert(r->left,x);\n    else if(x>r->data) r->right=insert(r->right,x);\n    return r;\n}\nNode* minNode(Node* r) { while(r && r->left) r=r->left; return r; }\nNode* deleteNode(Node* r,int key) {\n    if(!r) return r;\n    if(key<r->data) r->left=deleteNode(r->left,key);\n    else if(key>r->data) r->right=deleteNode(r->right,key);\n    else {\n        if(!r->left) { Node* t=r->right; delete r; return t; }\n        if(!r->right) { Node* t=r->left; delete r; return t; }\n        Node* t=minNode(r->right); r->data=t->data;\n        r->right=deleteNode(r->right,t->data);\n    }\n    return r;\n}\nvoid inorder(Node* r){if(r){inorder(r->left);cout<<r->data<<' ';inorder(r->right);}}\nint main(){\n    Node* root=NULL; int n,x,key; cin>>n;\n    for(int i=0;i<n;i++){cin>>x;root=insert(root,x);}\n    cout<<\"Enter value to delete: \";cin>>key;\n    root=deleteNode(root,key); inorder(root); cout<<'\\n'; return 0;\n}"], "notes": ""}, {"section": "Practical 5 — BINARY SEARCH TREE (BST)", "title": "Q4. Find minimum and maximum in BST.", "description": "", "codes": ["#include <iostream>\nusing namespace std;\nstruct Node { int data; Node *left,*right; Node(int x):data(x),left(NULL),right(NULL){} };\nNode* insert(Node* r,int x){if(!r)return new Node(x);if(x<r->data)r->left=insert(r->left,x);else if(x>r->data)r->right=insert(r->right,x);return r;}\nint main(){\n    Node* root=NULL; int n,x; cin>>n;\n    for(int i=0;i<n;i++){cin>>x;root=insert(root,x);}\n    if(!root){cout<<\"Tree empty\\n\";return 0;}\n    Node *p=root; while(p->left)p=p->left; cout<<\"Minimum: \"<<p->data<<'\\n';\n    p=root; while(p->right)p=p->right; cout<<\"Maximum: \"<<p->data<<'\\n';\n    return 0;\n}"], "notes": "============================================================\nPRACTICAL 6 — TREE TRAVERSAL\n============================================================"}, {"section": "Practical 6 — TREE TRAVERSAL", "title": "Q1. Create a binary tree and perform preorder, inorder and postorder.", "description": "", "codes": ["#include <iostream>\nusing namespace std;\nstruct Node { char data; Node *left,*right; Node(char x):data(x),left(NULL),right(NULL){} };\nvoid preorder(Node* r){if(r){cout<<r->data<<' ';preorder(r->left);preorder(r->right);}}\nvoid inorder(Node* r){if(r){inorder(r->left);cout<<r->data<<' ';inorder(r->right);}}\nvoid postorder(Node* r){if(r){postorder(r->left);postorder(r->right);cout<<r->data<<' ';}}\nint main(){\n    Node* root=new Node('A');\n    root->left=new Node('B'); root->right=new Node('C');\n    root->left->left=new Node('D'); root->left->right=new Node('E');\n    cout<<\"Preorder: \";preorder(root);\n    cout<<\"\\nInorder: \";inorder(root);\n    cout<<\"\\nPostorder: \";postorder(root);\n    return 0;\n}"], "notes": ""}, {"section": "Practical 6 — TREE TRAVERSAL", "title": "Q2. Organization hierarchy: use the same traversal program above; replace A, B, C, D, E with CEO, Manager1, Manager2, Emp1, Emp2 (use string data if names are needed).", "description": "", "codes": [], "notes": ""}, {"section": "Practical 6 — TREE TRAVERSAL", "title": "Q3. Level-order traversal of a binary tree.", "description": "", "codes": ["#include <iostream>\n#include <queue>\nusing namespace std;\nstruct Node { int data; Node *left,*right; Node(int x):data(x),left(NULL),right(NULL){} };\nvoid levelOrder(Node* root){\n    if(!root)return;\n    queue<Node*> q; q.push(root);\n    while(!q.empty()){\n        Node* t=q.front();q.pop();cout<<t->data<<' ';\n        if(t->left)q.push(t->left);\n        if(t->right)q.push(t->right);\n    }\n}\nint main(){\n    Node* root=new Node(1); root->left=new Node(2); root->right=new Node(3);\n    root->left->left=new Node(4); root->left->right=new Node(5);\n    levelOrder(root); return 0;\n}"], "notes": ""}, {"section": "Practical 6 — TREE TRAVERSAL", "title": "Q4. LeetCode 103 — Binary Tree Zigzag Level Order Traversal (submission code).", "description": "", "codes": ["class Solution {\npublic:\n    vector<vector<int>> zigzagLevelOrder(TreeNode* root) {\n        vector<vector<int>> ans;\n        if (!root) return ans;\n        queue<TreeNode*> q; q.push(root);\n        bool leftToRight = true;\n        while (!q.empty()) {\n            int n = q.size();\n            vector<int> level(n);\n            for (int i = 0; i < n; i++) {\n                TreeNode* cur = q.front(); q.pop();\n                int idx = leftToRight ? i : n - 1 - i;\n                level[idx] = cur->val;\n                if (cur->left) q.push(cur->left);\n                if (cur->right) q.push(cur->right);\n            }\n            ans.push_back(level);\n            leftToRight = !leftToRight;\n        }\n        return ans;\n    }\n};"], "notes": "For LeetCode submission, include #include <vector> and #include <queue> if your platform requires them.\n\n============================================================\nPRACTICAL 7 — HASH TABLE\n============================================================"}, {"section": "Practical 7 — HASH TABLE", "title": "Q1/Q2. Hash table with separate chaining: insert, search, delete and display.", "description": "", "codes": ["#include <iostream>\n#include <list>\nusing namespace std;\nclass HashTable {\n    static const int SIZE = 10;\n    list<int> table[SIZE];\n    int hashFunction(int key) { return (key % SIZE + SIZE) % SIZE; }\npublic:\n    void insert(int key) {\n        int i=hashFunction(key);\n        for(int x:table[i]) if(x==key){cout<<\"Already exists\\n\";return;}\n        table[i].push_back(key); cout<<\"Inserted\\n\";\n    }\n    bool search(int key) {\n        int i=hashFunction(key);\n        for(int x:table[i]) if(x==key)return true;\n        return false;\n    }\n    void removeKey(int key) {\n        int i=hashFunction(key);\n        table[i].remove(key);\n        cout<<\"Delete operation completed\\n\";\n    }\n    void display() {\n        for(int i=0;i<SIZE;i++){\n            cout<<\"Bucket \"<<i<<\": \";\n            for(int x:table[i]) cout<<x<<\" -> \";\n            cout<<\"NULL\\n\";\n        }\n    }\n};\nint main() {\n    HashTable h; int ch,x;\n    do {\n        cout<<\"\\n1.Insert 2.Search 3.Delete 4.Display 5.Exit\\nChoice: \";cin>>ch;\n        if(ch==1){cout<<\"Key: \";cin>>x;h.insert(x);}\n        else if(ch==2){cout<<\"Key: \";cin>>x;cout<<(h.search(x)?\"Found\\n\":\"Not found\\n\");}\n        else if(ch==3){cout<<\"Key: \";cin>>x;h.removeKey(x);}\n        else if(ch==4)h.display();\n    }while(ch!=5);\n    return 0;\n}"], "notes": ""}, {"section": "Practical 7 — HASH TABLE", "title": "Q3. Store multiple values and display the hash table using separate chaining.", "description": "Use the complete HashTable program in Practical 7 Q1/Q2. This question asks you to apply that same program.", "codes": [], "notes": ""}, {"section": "Practical 7 — HASH TABLE", "title": "Q4. Search for a key and display its bucket position.", "description": "Use the complete HashTable program in Practical 7 Q1/Q2. This question asks you to apply that same program.", "codes": [], "notes": ""}, {"section": "Practical 7 — HASH TABLE", "title": "Q5. LeetCode 1 — Two Sum using a hash table (submission code).", "description": "", "codes": ["class Solution {\npublic:\n    vector<int> twoSum(vector<int>& nums, int target) {\n        unordered_map<int,int> seen;\n        for (int i=0; i<(int)nums.size(); i++) {\n            int need = target - nums[i];\n            if (seen.count(need)) return {seen[need], i};\n            seen[nums[i]] = i;\n        }\n        return {};\n    }\n};"], "notes": "Include <vector> and <unordered_map> if required.\n\n============================================================\nPRACTICAL 8 — SORTING\n============================================================"}, {"section": "Practical 8 — SORTING", "title": "Q1(a). Bubble sort ascending.", "description": "", "codes": ["#include <iostream>\nusing namespace std;\nint main(){\n    int n,a[100];cin>>n;\n    for(int i=0;i<n;i++)cin>>a[i];\n    for(int i=0;i<n-1;i++)\n        for(int j=0;j<n-i-1;j++)\n            if(a[j]>a[j+1]){int t=a[j];a[j]=a[j+1];a[j+1]=t;}\n    for(int i=0;i<n;i++)cout<<a[i]<<' ';\n    return 0;\n}"], "notes": ""}, {"section": "Practical 8 — SORTING", "title": "Q1(b). Insertion sort ascending.", "description": "", "codes": ["#include <iostream>\nusing namespace std;\nint main(){\n    int n,a[100];cin>>n;\n    for(int i=0;i<n;i++)cin>>a[i];\n    for(int i=1;i<n;i++){\n        int key=a[i],j=i-1;\n        while(j>=0 && a[j]>key){a[j+1]=a[j];j--;}\n        a[j+1]=key;\n    }\n    for(int i=0;i<n;i++)cout<<a[i]<<' ';\n    return 0;\n}"], "notes": ""}, {"section": "Practical 8 — SORTING", "title": "Q1(c). Selection sort ascending.", "description": "", "codes": ["#include <iostream>\nusing namespace std;\nint main(){\n    int n,a[100];cin>>n;\n    for(int i=0;i<n;i++)cin>>a[i];\n    for(int i=0;i<n-1;i++){\n        int minIndex=i;\n        for(int j=i+1;j<n;j++)if(a[j]<a[minIndex])minIndex=j;\n        int t=a[i];a[i]=a[minIndex];a[minIndex]=t;\n    }\n    for(int i=0;i<n;i++)cout<<a[i]<<' ';\n    return 0;\n}"], "notes": ""}, {"section": "Practical 8 — SORTING", "title": "Q2. Bubble sort descending.", "description": "", "codes": ["#include <iostream>\nusing namespace std;\nint main(){\n    int n,a[100];cin>>n;\n    for(int i=0;i<n;i++)cin>>a[i];\n    for(int i=0;i<n-1;i++)\n        for(int j=0;j<n-i-1;j++)\n            if(a[j]<a[j+1]){int t=a[j];a[j]=a[j+1];a[j+1]=t;}\n    for(int i=0;i<n;i++)cout<<a[i]<<' ';\n    return 0;\n}"], "notes": ""}, {"section": "Practical 8 — SORTING", "title": "Q3. Merge sort.", "description": "", "codes": ["#include <iostream>\nusing namespace std;\nvoid merge(int a[],int l,int m,int r){\n    int n1=m-l+1,n2=r-m;\n    int L[100],R[100];\n    for(int i=0;i<n1;i++)L[i]=a[l+i];\n    for(int j=0;j<n2;j++)R[j]=a[m+1+j];\n    int i=0,j=0,k=l;\n    while(i<n1&&j<n2)a[k++]=(L[i]<=R[j])?L[i++]:R[j++];\n    while(i<n1)a[k++]=L[i++];\n    while(j<n2)a[k++]=R[j++];\n}\nvoid mergeSort(int a[],int l,int r){\n    if(l>=r)return;\n    int m=l+(r-l)/2;\n    mergeSort(a,l,m);mergeSort(a,m+1,r);merge(a,l,m,r);\n}\nint main(){\n    int n,a[100];cin>>n;\n    for(int i=0;i<n;i++)cin>>a[i];\n    mergeSort(a,0,n-1);\n    for(int i=0;i<n;i++)cout<<a[i]<<' ';\n    return 0;\n}"], "notes": ""}, {"section": "Practical 8 — SORTING", "title": "Q4. LeetCode 2418 — Sort the People (submission code).", "description": "", "codes": ["class Solution {\npublic:\n    vector<string> sortPeople(vector<string>& names, vector<int>& heights) {\n        vector<pair<int,string>> p;\n        for (int i=0; i<(int)names.size(); i++)\n            p.push_back({heights[i], names[i]});\n        sort(p.rbegin(), p.rend());\n        vector<string> ans;\n        for (auto &x : p) ans.push_back(x.second);\n        return ans;\n    }\n};"], "notes": "Include <vector>, <string>, <algorithm> if required.\n\n============================================================\nPRACTICAL 9 — LINEAR AND BINARY SEARCH\n============================================================"}, {"section": "Practical 9 — LINEAR AND BINARY SEARCH", "title": "Q1. Employee ID search using linear and binary search. Binary search requires sorted data.", "description": "", "codes": ["#include <iostream>\n#include <algorithm>\nusing namespace std;\nint linearSearch(int a[],int n,int key){\n    for(int i=0;i<n;i++)if(a[i]==key)return i;\n    return -1;\n}\nint binarySearch(int a[],int n,int key){\n    int low=0,high=n-1;\n    while(low<=high){\n        int mid=low+(high-low)/2;\n        if(a[mid]==key)return mid;\n        else if(a[mid]<key)low=mid+1;\n        else high=mid-1;\n    }\n    return -1;\n}\nint main(){\n    int n,a[100],key;cin>>n;\n    for(int i=0;i<n;i++)cin>>a[i];\n    cout<<\"Enter employee ID: \";cin>>key;\n    int pos=linearSearch(a,n,key);\n    if(pos!=-1)cout<<\"Linear Search position: \"<<pos+1<<'\\n';\n    else cout<<\"Linear Search: Not found\\n\";\n    sort(a,a+n);\n    pos=binarySearch(a,n,key);\n    if(pos!=-1)cout<<\"Binary Search position in sorted array: \"<<pos+1<<'\\n';\n    else cout<<\"Binary Search: Not found\\n\";\n    return 0;\n}"], "notes": ""}, {"section": "Practical 9 — LINEAR AND BINARY SEARCH", "title": "Q2. Linear search.", "description": "", "codes": ["#include <iostream>\nusing namespace std;\nint main(){\n    int n,a[100],key,found=-1;\n    cout<<\"Enter number of elements: \";cin>>n;\n    for(int i=0;i<n;i++)cin>>a[i];\n    cout<<\"Enter element to search: \";cin>>key;\n    for(int i=0;i<n;i++)if(a[i]==key){found=i;break;}\n    if(found!=-1)cout<<\"Element found at position \"<<found+1;\n    else cout<<\"Element not found\";\n    return 0;\n}"], "notes": ""}, {"section": "Practical 9 — LINEAR AND BINARY SEARCH", "title": "Q3. LeetCode 704 — Binary Search (submission code).", "description": "", "codes": ["class Solution {\npublic:\n    int search(vector<int>& nums, int target) {\n        int low=0, high=(int)nums.size()-1;\n        while(low<=high){\n            int mid=low+(high-low)/2;\n            if(nums[mid]==target)return mid;\n            if(nums[mid]<target)low=mid+1;\n            else high=mid-1;\n        }\n        return -1;\n    }\n};"], "notes": "Include <vector> if required. LeetCode expects a zero-based index, while a classroom program may display position as index + 1.\n\n============================================================"}], "memory": "LAST-MINUTE MEMORY SHEET\n============================================================\nSTACK:\n- Initially top = -1\n- PUSH: if top == MAX-1 => overflow; otherwise stack[++top] = value\n- POP: if top == -1 => underflow; otherwise print stack[top], then top--\n\nQUEUE (linear array):\n- Initially front = rear = -1\n- Enqueue: if rear == MAX-1 => overflow; if front == -1 set front = 0; then a[++rear] = value\n- Dequeue: if front == -1 => empty; otherwise remove a[front]; if front == rear reset both to -1, else front++\n\nBST:\n- Smaller values go left; larger values go right\n- Inorder = Left, Root, Right (BST inorder prints sorted order)\n- Preorder = Root, Left, Right\n- Postorder = Left, Right, Root\n- Minimum = keep moving left; Maximum = keep moving right\n\nHASH TABLE:\n- Common hash function: index = key % tableSize\n- Collision = two keys map to the same bucket\n- Separate chaining = linked list/list in each bucket\n\nSORTING:\n- Bubble: compare adjacent elements and swap\n- Insertion: take key and shift larger elements right\n- Selection: select smallest remaining element and swap into place\n- Merge: divide, sort halves, merge\n- Ascending comparisons use > for bubble swaps; descending uses <\n\nSEARCHING:\n- Linear search works on unsorted arrays; time O(n)\n- Binary search requires sorted array; time O(log n)\n- Binary search: low=0, high=n-1, mid=low+(high-low)/2\n\nCOMMON TIME COMPLEXITIES:\n- Linear search: O(n)\n- Binary search: O(log n)\n- Bubble / Insertion / Selection sort: O(n^2) average/worst\n- Merge sort: O(n log n)\n- BST search: average O(log n), worst O(n)", "intro": "C++ Data Structures Practical Exam Revision", "notice": "Practical 2 was not present in the uploaded TXT, so its exact questions are not included."};
const search=document.getElementById('search'),content=document.getElementById('content'),stats=document.getElementById('stats');document.getElementById('memory').textContent=DATA.memory;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(){const term=search.value.trim().toLowerCase();const shown=DATA.items.filter(q=>[q.section,q.title,q.description,q.notes,...q.codes].join(' ').toLowerCase().includes(term));stats.textContent=shown.length+' of '+DATA.items.length+' questions';content.innerHTML='';if(!shown.length){content.innerHTML='<div class="empty">No matching questions found. Try “stack”, “BST”, “sort” or “search”.</div>';return;}let last='';shown.forEach(q=>{if(q.section!==last){last=q.section;const h=document.createElement('h2');h.className='section-title';h.textContent=last;content.appendChild(h);}const card=document.createElement('article');card.className='question';const head=document.createElement('div');head.className='qhead';head.tabIndex=0;head.setAttribute('role','button');head.setAttribute('aria-expanded','false');head.innerHTML='<div class="qtitle">'+esc(q.title)+'</div><div class="qmeta">'+(q.codes.length?'Code included':'Answer / note')+'　＋</div>';const body=document.createElement('div');body.className='qbody hidden';if(q.description){const p=document.createElement('p');p.className='description';p.textContent=q.description;body.appendChild(p);}q.codes.forEach((code,i)=>{const wrap=document.createElement('div');wrap.className='codewrap';const top=document.createElement('div');top.className='codetop';const label=document.createElement('span');label.textContent='COMPLETE C++ CODE'+(q.codes.length>1?' '+(i+1):'');const btn=document.createElement('button');btn.className='copy';btn.textContent='Copy code';btn.addEventListener('click',async e=>{e.stopPropagation();try{await navigator.clipboard.writeText(code);}catch(err){const ta=document.createElement('textarea');ta.value=code;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}btn.textContent='Copied ✓';btn.classList.add('copied');setTimeout(()=>{btn.textContent='Copy code';btn.classList.remove('copied');},1400);});top.append(label,btn);const pre=document.createElement('pre'),c=document.createElement('code');c.textContent=code;pre.appendChild(c);wrap.append(top,pre);body.appendChild(wrap);});if(q.notes){const n=document.createElement('p');n.className='notes';n.textContent=q.notes;body.appendChild(n);}const toggle=()=>{body.classList.toggle('hidden');const open=!body.classList.contains('hidden');head.setAttribute('aria-expanded',String(open));head.querySelector('.qmeta').textContent=(q.codes.length?'Code included':'Answer / note')+'　'+(open?'−':'＋');};head.addEventListener('click',toggle);head.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}});card.append(head,body);content.appendChild(card);});}
search.addEventListener('input',render);document.getElementById('clearSearch').addEventListener('click',()=>{search.value='';render();search.focus();});document.getElementById('copyMemory').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(DATA.memory);}catch(e){const ta=document.createElement('textarea');ta.value=DATA.memory;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}const b=document.getElementById('copyMemory');b.textContent='Copied ✓';setTimeout(()=>b.textContent='Copy memory sheet',1400);});render();
